name: Go engine

on:
  push:
    branches: [milestone-19-artifact-pipeline, milestone-21-control-api, milestone-22-redis-inspection-worker]
    paths:
      - "engine/**"
      - "dashboard/**"
      - ".github/workflows/engine.yml"
  pull_request:
    paths:
      - "engine/**"
      - ".github/workflows/engine.yml"

permissions:
  contents: read

jobs:
  dashboard-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dashboard dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check dashboard
        run: npx tsc --noEmit
      - name: Build dashboard with CI-only AppDeploy SDK stub
        run: APPDEPLOY_CI_STUB=true npm run build

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
          cache-dependency-path: engine/go.mod
      - name: Format Go files before checks
        run: gofmt -w .
      - name: Resolve dependencies
        run: go mod tidy
      - name: Test
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build API and worker binaries
        run: go build ./cmd/api ./cmd/worker
